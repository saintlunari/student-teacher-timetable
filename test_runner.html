<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Harness Engineering Benchmark Test Runner Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8 antialiased">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="border-b border-slate-800 pb-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i data-lucide="shield-check" class="text-emerald-400"></i>
          교생 수업 배당표 하네스 엔지니어링 벤치마크 테스트 Pro
        </h1>
        <p class="text-xs text-slate-400 mt-1">골든 시나리오 + 연강(블록타임) 및 압축 차시(3~4) 무결성 자동 검증</p>
      </div>
      <button onclick="runAllTests()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 font-semibold text-xs rounded-xl shadow transition flex items-center gap-2">
        <i data-lucide="play" class="w-4 h-4"></i> 테스트 전체 재실행
      </button>
    </div>

    <!-- Summary cards -->
    <div class="grid grid-cols-3 gap-4 text-center">
      <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
        <span class="text-xs text-slate-400">총 테스트 케이스</span>
        <div id="total-tests" class="text-2xl font-black text-white mt-1">11</div>
      </div>
      <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
        <span class="text-xs text-slate-400">성공 (Passed)</span>
        <div id="passed-tests" class="text-2xl font-black text-emerald-400 mt-1">0</div>
      </div>
      <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
        <span class="text-xs text-slate-400">실패 (Failed)</span>
        <div id="failed-tests" class="text-2xl font-black text-rose-400 mt-1">0</div>
      </div>
    </div>

    <!-- Test results list -->
    <div id="test-results" class="space-y-3">
      <!-- Injected by JS -->
    </div>

    <div class="pt-4 text-center text-xs text-slate-500">
      <a href="index.html" class="text-sky-400 hover:underline inline-flex items-center gap-1">
        &larr; 수업 배당표 메인 시스템으로 이동
      </a>
    </div>
  </div>

  <iframe id="app-frame" src="index.html" style="position:fixed;top:-9999px;left:-9999px;width:1024px;height:768px;border:none;"></iframe>
  <script>
    var App = null;
    const testCases = [
      {
        id: 'tc1',
        title: '[사진 1] 공주교대부초 2학년 - 교과 차시 순서 무결성 테스트',
        desc: '국어, 수학, 슬생, 즐생, 바생 차시가 시간 흐름에 따라 100% 오름차순으로 배치되는지 검증',
        run: () => {
          App.loadPreset('grade2', false);
          App.runAutoAllocation(false);
          const totalDays = (App.config.weekCount || 2) * 5;
          const subjectOccurrences = {};
          const parseNum = (s) => parseInt(String(s).match(/\d+/)[0], 10);

          const maxP = App.periodsPerDay || 8;
          for (let d = 0; d < totalDays; d++) {
            for (let p = 1; p <= maxP; p++) {
              const cell = App.timetable[`${d}-${p}`];
              if (cell && cell.subject && cell.lesson) {
                if (!subjectOccurrences[cell.subject]) subjectOccurrences[cell.subject] = [];
                subjectOccurrences[cell.subject].push({ lesson: parseNum(cell.lesson), day: d, period: p });
              }
            }
          }
          let violations = 0;
          const badSubs = [];
          Object.keys(subjectOccurrences).forEach(sub => {
            const list = subjectOccurrences[sub];
            for (let i = 0; i < list.length - 1; i++) {
              if (list[i].lesson > list[i+1].lesson) {
                violations++;
                badSubs.push(`${sub}: ` + list.map(x => `${x.day}-${x.period}:L${x.lesson}`).join(' '));
              }
            }
          });
          return { pass: violations === 0, message: violations === 0 ? '차시 역전 0건: 완벽한 순서 보장' : `${violations}건 역전: ` + badSubs.join(' | ') };
        }
      },
      {
        id: 'tc2',
        title: '[사진 1] 공주교대부초 2학년 - 행사 및 잠긴 슬롯 침범 방지 테스트',
        desc: '강의 1~5, 수업참관, 개교기념일, 학급협의회 슬롯에 일반 수업이 침범하지 않는지 검증',
        run: () => {
          let lockViolations = 0;
          const badKeys = [];
          const studentTeacherNames = App.teachers.map(t => t.name);
          Object.keys(App.events).forEach(key => {
            const ev = App.events[key];
            const tt = App.timetable[key];
            if (ev && ev.isLocked && tt && studentTeacherNames.includes(tt.teacher) && ev.type !== 'homeroom') {
              lockViolations++;
              badKeys.push(key + ':' + ev.subject);
            }
          });
          return { pass: lockViolations === 0, message: lockViolations === 0 ? '잠긴 행사 30여 개 슬롯 100% 보존' : `${lockViolations}건 충돌: ` + badKeys.join(',') };
        }
      },
      {
        id: 'tc3',
        title: '[사진 1] 공주교대부초 2학년 - 실습생 시수 공평성(Fairness) 테스트',
        desc: '김부설, 이공주, 삼알밤 3인이 각각 6시수씩 오차 0으로 완벽하게 균등 분배되는지 검증',
        run: () => {
          const counts = App.teachers.map(t => {
            return Object.values(App.timetable).filter(c => c && c.teacher === t.name).length;
          });
          const allEqual = counts.every(c => c === counts[0]);
          return { pass: allEqual && counts[0] === 6, message: `각 교생별 배정 시수: [${counts.join(', ')}] -> 전원 ${counts[0]}시수 완벽 일치` };
        }
      },
      {
        id: 'tc4',
        title: '[사진 2] 공주교대부초 3학년 (4주간 5인) - 대규모 차시 순서 무결성 테스트',
        desc: '50개 차시, 4주간(20일) 일정에서 전 교과의 차시 역전 발생 여부 검증',
        run: () => {
          App.loadPreset('grade3', false);
          App.runAutoAllocation(false);
          const totalDays = 20;
          const subjectOccurrences = {};
          const parseNum = (s) => parseInt(String(s).match(/\d+/)[0], 10);

          const maxP = App.periodsPerDay || 8;
          for (let d = 0; d < totalDays; d++) {
            for (let p = 1; p <= maxP; p++) {
              const cell = App.timetable[`${d}-${p}`];
              if (cell && cell.subject && cell.lesson) {
                if (!subjectOccurrences[cell.subject]) subjectOccurrences[cell.subject] = [];
                subjectOccurrences[cell.subject].push({ lesson: parseNum(cell.lesson), day: d, period: p });
              }
            }
          }
          let violations = 0;
          Object.keys(subjectOccurrences).forEach(sub => {
            const list = subjectOccurrences[sub];
            for (let i = 0; i < list.length - 1; i++) {
              if (list[i].lesson > list[i+1].lesson) violations++;
            }
          });
          return { pass: violations === 0, message: violations === 0 ? '50개 차시 전체 순서성 100% 만족' : `${violations}건 차시 역전` };
        }
      },
      {
        id: 'tc5',
        title: '[사진 2] 공주교대부초 3학년 - 5인 실습생 시수 균등 분배 테스트',
        desc: '김부설, 이공주, 삼알밤, 사산성, 오금강 5인의 총 시수 편차가 최대 1 이내인지 검증',
        run: () => {
          const counts = App.teachers.map(t => {
            return Object.values(App.timetable).filter(c => c && c.teacher === t.name).length;
          });
          const max = Math.max(...counts);
          const min = Math.min(...counts);
          const diff = max - min;
          return { pass: diff <= 1, message: `5인 시수: [${counts.join(', ')}] (최대 시수 차이: ${diff}시간 - 오차 1시간 이내 균등)` };
        }
      },
      {
        id: 'tc6',
        title: '[사진 2] 공주교대부초 3학년 - 교과 경험 다양성 지수(Diversity) 테스트',
        desc: '각 교생이 최소 5개 이상의 다양한 교과목 수업을 골고루 배정받았는지 검증',
        run: () => {
          const varieties = App.teachers.map(t => {
            const set = new Set(Object.values(App.timetable).filter(c => c && c.teacher === t.name).map(c => c.subject));
            return set.size;
          });
          const minVariety = Math.min(...varieties);
          return { pass: minVariety >= 5, message: `각 교생별 담당 교과 수: [${varieties.join(', ')}]종목 (모두 5과목 이상 다채로운 수업 경험 확보)` };
        }
      },
      {
        id: 'tc7',
        title: '[신규 기능] 빠른 일정 스탬프 만들기 & 프리셋 원클릭 도장 및 압축 차시(3~4) 테스트',
        desc: '나만의 스탬프 생성, 무팝업 즉시 도장 찍기, 지우개 동작, 압축 차시(3~4) 보존 무결성 검증',
        run: () => {
          // 1. 커스텀 스탬프 생성
          const custom = App.createCustomStamp({
            type: 'lecture',
            subject: '강의:생활지도',
            pages: '상담기법',
            teacher: '김부장'
          });

          // 2. 0일차 2교시에 도장 찍기
          App.applyStampToCell(0, 2);
          const ev = App.events['0-2'];
          const stampSuccess = ev && ev.subject === '강의:생활지도' && ev.teacher === '김부장' && ev.isLocked;

          // 3. 지우개 도장 찍기
          App.setCurrentStamp('clear', '', '', '');
          App.applyStampToCell(0, 2);
          const clearSuccess = !App.events['0-2'];

          // 4. 1교시 2차시 분량 압축 차시(3~4) 스케줄링 검증
          App.curriculum.unshift({
            id: 'test_compressed_lesson',
            subject: '체육',
            pages: '40-43',
            lesson: '3~4',
            totalLesson: 12
          });
          App.runAutoAllocation(false);

          let foundCompressed = false;
          Object.values(App.timetable).forEach(c => {
            if (c && c.curriculumId === 'test_compressed_lesson' && c.lesson === '3~4') {
              foundCompressed = true;
            }
          });

          const pass = stampSuccess && clearSuccess && foundCompressed;
          return {
            pass,
            message: pass
              ? `스탬프 생성·원클릭 도장 성공, 지우개 삭제 검증 완료, 압축 차시('3~4/12') 1교시 배당 무결성 100% 만족`
              : `스탬프 또는 압축 차시 배당 실패 (stamp: ${stampSuccess}, clear: ${clearSuccess}, comp: ${foundCompressed})`
          };
        }
      },
      {
        id: 'tc8',
        title: '[신규 기능] 대표수업 차시 지정, 사전 교생 배정, 시간표 슬롯 연동 무결성 테스트',
        desc: '진도표 내 대표수업(isDemo) 및 사전 배정 교생과 시간표 상의 교생대표(trainee_demo) 슬롯이 Hard-Lock 및 솔버에 정확히 연동되는지 검증',
        run: () => {
          App.loadPreset('grade2', false);
          // 1. 특정 슬롯에 교생 대표수업 스탬프 찍기 (예: 1주차 수요일 2교시 '2-2')
          App.events['2-2'] = {
            type: 'trainee_demo',
            subject: '교생대표',
            pages: '국어',
            lessonStr: '대표수업',
            teacher: '김부설',
            isLocked: true,
            isTraineeDemo: true
          };

          // 2. 자동 배당 실행
          App.runAutoAllocation(false);

          // 3. '2-2' 슬롯 검증
          const cell = App.timetable['2-2'];
          const slotLocked = cell && cell.isDemo && cell.teacher === '김부설' && cell.subject === '국어' && cell.isLocked;

          // 4. 진도표 사전 배정 교생 검증
          App.curriculum[1].designatedTeacher = '이공주';
          App.runAutoAllocation(false);
          const designatedCell = Object.values(App.timetable).find(c => c && c.curriculumId === App.curriculum[1].id);
          const desigSuccess = designatedCell && designatedCell.teacher === '이공주';

          const pass = slotLocked && desigSuccess;
          return {
            pass,
            message: pass
              ? `교생 대표수업 슬롯 Hard-Lock 연동 성공(김부설/국어) & 사전 배정 교생(이공주) 우선 확정 배정 무결성 100% 만족`
              : `대표수업 또는 사전 배정 실패 (slotLocked: ${slotLocked}, desigSuccess: ${desigSuccess})`
          };
        }
      },
      {
        id: 'tc9',
        title: '[신규 기능] 2학년 국어·수학·통합교과(바·슬·즐) 표준 DB(총 745차시) 전수 탑재 및 통합교과 임포트 무결성 테스트',
        desc: '2학년 1·2학기 국어/수학/통합교과(바생·슬생·즐생) 745차시 전수 탑재, 주제별 필터링 및 교과별 진도표 원클릭 임포트 동작 검증',
        run: () => {
          const db = App.getCurriculumDb ? App.getCurriculumDb() : window.CURRICULUM_DB_GRADE2 || (frame = document.getElementById('app-frame'), frame.contentWindow.CURRICULUM_DB_GRADE2);
          if (!db) {
            return { pass: false, message: 'CURRICULUM_DB_GRADE2 데이터베이스 객체를 찾을 수 없음' };
          }

          const k1Count = (db.grade2_korean_1 || []).length;
          const k2Count = (db.grade2_korean_2 || []).length;
          const m1Count = (db.grade2_math_1 || []).length;
          const m2Count = (db.grade2_math_2 || []).length;
          const int1Count = (db.grade2_integrated_1 || []).length;
          const int2Count = (db.grade2_integrated_2 || []).length;
          const totalCount = k1Count + k2Count + m1Count + m2Count + int1Count + int2Count;

          const countsValid = (
            k1Count === 118 && k2Count === 117 &&
            m1Count === 64 && m2Count === 62 &&
            int1Count === 192 && int2Count === 192 &&
            totalCount === 745
          );

          // 2. 통합교과 모달 임포트 기능 검증 (1학기 통합 '나' 단원 48차시 중 '바생' 필터링)
          App.setCurriculumDbSemester('1학기');
          App.setCurriculumDbSubject('바생');
          App.onCurriculumDbUnitChange('나');
          App.toggleAllCurriculumDb(true);
          const selCount = App.curriculumDbState.selectedIndices.size;

          // 진도표에 임포트
          const prevLen = App.curriculum.length;
          App.importSelectedCurriculumDb(false);

          const newLen = App.curriculum.length;
          const newlyAdded = App.curriculum.slice(prevLen);
          const allBaSaeng = newlyAdded.every(c => c.subject === '바생');
          const importSuccess = (newLen === prevLen + selCount) && (selCount === 9) && allBaSaeng;

          const pass = countsValid && importSuccess;
          return {
            pass,
            message: pass
              ? `2학년 국어·수학·통합 745차시 완벽 탑재(국:235, 수:126, 통합:384) 및 통합교과 '나' 바생(9차시) 진도표 임포트 100% 성공`
              : `DB 검증 실패 (k1:${k1Count}, k2:${k2Count}, m1:${m1Count}, m2:${m2Count}, int1:${int1Count}, int2:${int2Count}, total:${totalCount}, import:${importSuccess})`
          };
        }
      },
      {
        id: 'tc10',
        title: '[신규 기능 4종] 기본정보 실시간 동기화, 교생 최대 시수 상한 엄격 준수, 스마트 이동 가이드(초록/빨강), 차시 원클릭 삭제 무결성 테스트',
        desc: 'Step 1 기본정보의 배당표 및 마감일 달력 즉각 동기화, 솔버의 최대 시수 초과 0건 보장, safe/unsafe 스마트 스왑 시각화, 배당 차시 개별 삭제 무결성 검증',
        run: () => {
          App.loadPreset('grade2', false);

          // 1. 기본정보 실시간 동기화 테스트
          const doc = App.iframeDocument || (document.getElementById('app-frame') ? document.getElementById('app-frame').contentDocument : document);
          const titleInput = doc.getElementById('cfg-title');
          const schoolInput = doc.getElementById('cfg-school');
          const gcInput = doc.getElementById('cfg-gradeClass');
          const teacherInput = doc.getElementById('cfg-teacherName');
          const startInput = doc.getElementById('cfg-startDate');

          if (titleInput) titleInput.value = '2026학년도 1학기 교육실습 배당표';
          if (schoolInput) schoolInput.value = '행복초등학교';
          if (gcInput) gcInput.value = '2학년 3반';
          if (teacherInput) teacherInput.value = '박선생';
          if (startInput) startInput.value = '2026-05-04';

          App.onConfigChange();
          App.setTeacherFilter(App.teachers[0].name);

          const viewTitle = doc.getElementById('view-title').innerText;
          const viewSchool = doc.getElementById('view-school').innerText;
          const viewGC = doc.getElementById('view-gradeClass').innerText;
          const viewTN = doc.getElementById('view-teacherName').innerText;
          const calSchool = doc.getElementById('calendar-school') ? doc.getElementById('calendar-school').innerText : '';
          const calGC = doc.getElementById('calendar-gradeClass') ? doc.getElementById('calendar-gradeClass').innerText : '';

          const syncPass = (
            viewTitle === '2026학년도 1학기 교육실습 배당표' &&
            viewSchool === '행복초등학교' &&
            viewGC === '2학년 3반' &&
            viewTN === '박선생' &&
            calSchool === '행복초등학교' &&
            calGC === '2학년 3반'
          );

          // 2. 교생 최대 시수 상한 엄격 준수 테스트
          // 예: 김부설 최대 4시수, 이공주 최대 5시수 설정
          App.teachers[0].maxHours = 4;
          App.teachers[1].maxHours = 5;
          App.teachers[2].maxHours = 8;
          App.runAutoAllocation(false);

          let maxHoursViolations = 0;
          App.teachers.forEach(t => {
            const assigned = Object.values(App.timetable).filter(c => c && c.teacher === t.name).length;
            const limit = (t.maxHours !== undefined && t.maxHours !== null && t.maxHours !== '') ? t.maxHours : (App.config.maxHours || 10);
            if (assigned > limit) {
              maxHoursViolations++;
            }
          });
          const maxHoursPass = (maxHoursViolations === 0);

          // 3. 스마트 스왑/이동 가이드 (초록/빨강) 테스트
          const testKey = Object.keys(App.timetable).find(k => App.timetable[k] && App.timetable[k].subject && !App.timetable[k].isLocked);
          App.highlightSwapTargets(testKey);

          const safeCells = doc.querySelectorAll('.tt-cell.swap-safe');
          const unsafeCells = doc.querySelectorAll('.tt-cell.swap-unsafe');
          const swapGuidePass = (safeCells.length > 0) && (unsafeCells.length > 0);
          App.clearSwapHighlights();

          // 4. 차시 개별 삭제 무결성 테스트
          const deleteTargetKey = testKey;
          const beforeDeleteCount = Object.keys(App.timetable).length;
          App.deleteCellClass(deleteTargetKey, null, true);
          const afterDeleteCount = Object.keys(App.timetable).length;
          const deletePass = (afterDeleteCount === beforeDeleteCount - 1) && (!App.timetable[deleteTargetKey]);

          const pass = syncPass && maxHoursPass && swapGuidePass && deletePass;
          return {
            pass,
            message: pass
              ? `기본정보 동기화(학교·반·교사·달력) 100%, 최대 시수 상한 초과 0건 보장, 스마트 이동 safe(${safeCells.length})/unsafe(${unsafeCells.length}) 식별, 원클릭 차시 삭제 무결성 완벽 검증`
              : `검증 실패 (sync:${syncPass}, maxHours:${maxHoursPass}, swap:${swapGuidePass}, delete:${deletePass})`
          };
        }
      },
      {
        id: 'tc11',
        title: '[신규 요구사항 3종] 단일 \'강의\' 스탬프, 8교시 시간표 확장, 배당 오류 빨간 테두리 표시 및 수정 후 자동 삭제 검증',
        desc: '강의1/4 제거 및 단일 \'강의\' 스탬프 동작, 1일 8교시 시간표 확장 및 8교시 슬롯 유효성, 배당표 오류 시 빨간 테두리(.cell-error) 표시 및 올바른 수정 후 테두리 자동 삭제 검증',
        run: () => {
          App.loadPreset('grade2', false);
          const doc = document.getElementById('app-frame').contentDocument;

          // 1. 단일 강의 스탬프 검증
          App.setCurrentStamp('lecture', '강의', '', '');
          App.applyStampToCell(0, 8); // 8교시에 도장 찍기
          const ev08 = App.events['0-8'];
          const stampPass = ev08 && ev08.type === 'lecture' && ev08.subject === '강의';

          // 2. 8교시 시간표 확장 검증 (1~8교시)
          const periodsPass = (App.periodsPerDay === 8) && (doc.querySelectorAll('#timetable-tbody tr').length >= 8);

          // 3. 배당표 정상 자동 배당 시 오류 0건 검증
          App.runAutoAllocation(false);
          const initialErrors = App.detectTimetableErrors();
          const zeroErrorPass = (initialErrors.errorCount === 0);

          // 4. 의도적 차시 순서 역전 발생 시 빨간 테두리(.cell-error) 표시 검증
          const subClasses = Object.keys(App.timetable).filter(k => App.timetable[k] && App.timetable[k].subject === '국어');
          let errorDetectedPass = false;
          let recoveryPass = false;

          if (subClasses.length >= 2) {
            const kEarly = subClasses[0];
            const kLate = subClasses[subClasses.length - 1];
            const itemEarly = { ...App.timetable[kEarly] };
            const itemLate = { ...App.timetable[kLate] };

            // Swap them to create an inversion
            App.timetable[kEarly] = itemLate;
            App.timetable[kLate] = itemEarly;
            App.renderTimetableGrid();

            const invertedErrors = App.detectTimetableErrors();
            const cellEarlyEl = doc.getElementById(`cell-${kEarly}`);
            const cellLateEl = doc.getElementById(`cell-${kLate}`);
            const hasCellErrorClass = (cellEarlyEl && cellEarlyEl.classList.contains('cell-error')) &&
                                      (cellLateEl && cellLateEl.classList.contains('cell-error'));

            errorDetectedPass = (invertedErrors.errorCount > 0) && hasCellErrorClass;

            // 5. 다시 원래대로 수정 후 빨간 테두리 자동 삭제 검증
            App.timetable[kEarly] = itemEarly;
            App.timetable[kLate] = itemLate;
            App.renderTimetableGrid();

            const recoveredErrors = App.detectTimetableErrors();
            const recEarlyEl = doc.getElementById(`cell-${kEarly}`);
            const recLateEl = doc.getElementById(`cell-${kLate}`);
            const noCellErrorClass = (recEarlyEl && !recEarlyEl.classList.contains('cell-error')) &&
                                     (recLateEl && !recLateEl.classList.contains('cell-error'));
            recoveryPass = (recoveredErrors.errorCount === 0) && noCellErrorClass;
          }

          const pass = stampPass && periodsPass && zeroErrorPass && errorDetectedPass && recoveryPass;
          return {
            pass,
            message: pass
              ? `단일 '강의' 스탬프 등록 성공, 8교시 시간표 확장(8행 그리드) 확인, 순서 역전 시 빨간 테두리(.cell-error) 표시 및 정상 수정 후 빨간 테두리 자동 삭제 100% 무결성 검증 완료`
              : `검증 실패 (stamp:${stampPass}, 8periods:${periodsPass}, zeroErr:${zeroErrorPass}, errDetected:${errorDetectedPass}, recovery:${recoveryPass})`
          };
        }
      },
      {
        id: 'tc12',
        title: '[신규 기능] 기본 정보·실습생·교과진도표 완벽 백업 & 복원, 전체폭 확대 레이아웃 및 교시 틀고정(Sticky) 검증',
        desc: 'Step 1 기본정보/실습생 및 Step 2 교과진도표 등록/수정 사항의 JSON 백업 직렬화, 데이터 오염 후 복원 시 DOM 테이블/입력창 100% 원복, 시간표 sticky left-0 및 전체폭 토글 동작 검증',
        run: () => {
          App.loadPreset('grade2', false);
          const doc = document.getElementById('app-frame').contentDocument;

          // 1. 기본정보 및 실습생 명단 수정
          const titleInput = doc.getElementById('cfg-title');
          const schoolInput = doc.getElementById('cfg-school');
          const gcInput = doc.getElementById('cfg-gradeClass');
          const teacherInput = doc.getElementById('cfg-teacherName');
          
          if (titleInput) titleInput.value = '2026학년도 부설초 실습 배당표';
          if (schoolInput) schoolInput.value = '국립한국초등학교';
          if (gcInput) gcInput.value = '3학년 5반';
          if (teacherInput) teacherInput.value = '최선생';
          App.onConfigChange();

          // 실습생 1의 이름과 전공 DOM input 직접 수정
          const teacherRows = doc.querySelectorAll('#teacher-table-body tr');
          if (teacherRows[0]) {
            const inputs = teacherRows[0].querySelectorAll('input');
            if (inputs[0]) inputs[0].value = '원더교생';
            if (inputs[1]) inputs[1].value = '수학교육';
          }
          App.syncTeachersFromDOM();
          App.renderCurriculumTable();

          // 2. Step 2 교과진도표 수정 및 추가
          App.setTab(2);
          const curRows = doc.querySelectorAll('#curriculum-table-body tr');
          if (curRows[0]) {
            const subIn = curRows[0].querySelector('input[data-field="subject"]');
            const lesIn = curRows[0].querySelector('input[data-field="lesson"]');
            const demoIn = curRows[0].querySelector('input[data-field="isDemo"]');
            const teaSel = curRows[0].querySelector('select[data-field="designatedTeacher"]');
            if (subIn) subIn.value = '통합미술';
            if (lesIn) lesIn.value = '3~4';
            if (demoIn) demoIn.checked = true;
            if (teaSel) teaSel.value = '원더교생';
          }
          // 차시 직접 추가
          App.curriculum.push({
            id: 'c_test_custom_sci',
            subject: '창의과학',
            pages: '88-89',
            lesson: '1',
            totalLesson: 10,
            topic: '자석의 성질',
            isDemo: false,
            designatedTeacher: ''
          });
          App.syncCurriculumFromDOM();
          App.renderCurriculumTable();

          const curCountBefore = App.curriculum.length;

          // 3. 백업 데이터 객체 생성 검증
          App.syncConfigFromInputs();
          App.syncTeachersFromDOM();
          App.syncCurriculumFromDOM();
          const backupPayload = {
            version: '2.1',
            config: JSON.parse(JSON.stringify(App.config)),
            teachers: JSON.parse(JSON.stringify(App.teachers)),
            curriculum: JSON.parse(JSON.stringify(App.curriculum)),
            events: JSON.parse(JSON.stringify(App.events)),
            defaultTimetable: JSON.parse(JSON.stringify(App.defaultTimetable)),
            morningDuty: JSON.parse(JSON.stringify(App.morningDuty)),
            timetable: JSON.parse(JSON.stringify(App.timetable)),
            customStamps: JSON.parse(JSON.stringify(App.customStamps || []))
          };

          const firstCur = backupPayload.curriculum[0];
          const lastCur = backupPayload.curriculum[backupPayload.curriculum.length - 1];
          const backupValid = (
            backupPayload.config.school === '국립한국초등학교' &&
            backupPayload.config.gradeClass === '3학년 5반' &&
            backupPayload.config.teacherName === '최선생' &&
            backupPayload.teachers[0].name === '원더교생' &&
            backupPayload.teachers[0].major === '수학교육' &&
            firstCur.subject === '통합미술' &&
            firstCur.lesson === '3~4' &&
            firstCur.isDemo === true &&
            firstCur.designatedTeacher === '원더교생' &&
            lastCur.subject === '창의과학'
          );

          // 4. 데이터를 다른 값으로 오염시킨 후 복원 시뮬레이션
          App.config.school = '오염된학교';
          App.config.gradeClass = '0학년 0반';
          App.teachers[0].name = '오염된교생';
          App.curriculum = []; // 진도표 완전 삭제
          App.populateInputsFromConfig();
          App.renderAll();

          // 복원
          App.config = Object.assign({}, App.config, backupPayload.config);
          App.teachers = JSON.parse(JSON.stringify(backupPayload.teachers));
          App.curriculum = JSON.parse(JSON.stringify(backupPayload.curriculum));
          App.populateInputsFromConfig();
          App.renderAll();

          const restoredSchoolInput = doc.getElementById('cfg-school') ? doc.getElementById('cfg-school').value : '';
          const restoredGCInput = doc.getElementById('cfg-gradeClass') ? doc.getElementById('cfg-gradeClass').value : '';
          const restoredTNInput = doc.getElementById('cfg-teacherName') ? doc.getElementById('cfg-teacherName').value : '';
          const teacherRowsAfter = doc.querySelectorAll('#teacher-table-body tr');
          const restoredTeacherInput = teacherRowsAfter[0]?.querySelectorAll('input')[0]?.value;

          const restoredCurRows = doc.querySelectorAll('#curriculum-table-body tr');
          const restoredCurSub = restoredCurRows[0]?.querySelector('input[data-field="subject"]')?.value;
          const restoredCurLes = restoredCurRows[0]?.querySelector('input[data-field="lesson"]')?.value;
          const restoredCurDemo = restoredCurRows[0]?.querySelector('input[data-field="isDemo"]')?.checked;
          const restoredCurTea = restoredCurRows[0]?.querySelector('select[data-field="designatedTeacher"]')?.value;
          const restoredBadgeText = doc.getElementById('curriculum-count-badge')?.innerText;

          const restorePass = (
            restoredSchoolInput === '국립한국초등학교' &&
            restoredGCInput === '3학년 5반' &&
            restoredTNInput === '최선생' &&
            restoredTeacherInput === '원더교생' &&
            restoredCurSub === '통합미술' &&
            restoredCurLes === '3~4' &&
            restoredCurDemo === true &&
            restoredCurTea === '원더교생' &&
            restoredBadgeText === `총 ${curCountBefore}차시` &&
            App.curriculum.length === curCountBefore
          );

          // 5. 시간표 틀고정(Sticky left-0) 및 전체폭 토글 동작 검증
          App.setTab(4);
          const thSticky = doc.querySelector('#timetable-thead th.sticky');
          const tdDutySticky = doc.querySelector('#timetable-tbody tr td.sticky');
          const stickyPass = !!(thSticky && tdDutySticky);

          // 전체폭 토글
          const initWide = App.timetableWideMode;
          App.toggleTimetableLayout();
          const toggledWide = App.timetableWideMode;
          App.toggleTimetableLayout(); // 원복
          const togglePass = (initWide === false && toggledWide === true);

          const pass = backupValid && restorePass && stickyPass && togglePass;
          return {
            pass,
            message: pass
              ? `기본정보·실습생명단·교과진도표(${curCountBefore}차시) 완벽 JSON 백업 직렬화 성공, 복원 후 Step 1 DOM 입력창 및 Step 2 진도표 테이블·배지 100% 연동 복구, 시간표 교시 sticky 틀고정 및 전체폭 레이아웃 토글 정상 확인`
              : `검증 실패 (backup:${backupValid}, restore:${restorePass}, sticky:${stickyPass}, toggle:${togglePass})`
          };
        }
      },
      {
        id: 'tc13',
        title: '[신규 기능] 1~4주차 전 주차 균등 배정, 마지막 2일 수업 배제 및 미배정 과목 자동 제거 검증',
        desc: '4주간 대규모 50차시 일정에서 1~4주차 골고루 수업 분배(4주차 10시간 이상 배정), 마지막 2일(목/금) 수업 0건 보장, 수업자 미배정 과목 배당표 자동 제거 및 정리 기능 검증',
        run: () => {
          App.loadPreset('grade3', false);
          App.runAutoAllocation(false);

          const tt = App.timetable;
          const weekCounts = [0, 0, 0, 0];
          let day18Count = 0;
          let day19Count = 0;
          let unassignedCount = 0;

          Object.keys(tt).forEach(k => {
            const cell = tt[k];
            if (cell && cell.subject && !cell.isLocked) {
              const [d, p] = k.split('-').map(Number);
              const w = Math.floor(d / 5);
              if (w < 4) weekCounts[w]++;
              if (d === 18) day18Count++;
              if (d === 19) day19Count++;
              if (!cell.teacher || cell.teacher.trim() === '') {
                unassignedCount++;
              }
            }
          });

          // 1. 1~4주차 모두 8차시 이상 골고루 배정되었는지 확인 (4주차에 몰아주거나 123주차에만 몰리지 않음)
          const allWeeksBalanced = weekCounts.every(cnt => cnt >= 8 && cnt <= 16);

          // 2. 마지막 2일(Day 18, Day 19) 수업 배제 확인
          const lastTwoDaysExcluded = (day18Count === 0 && day19Count === 0);

          // 3. 미배정 과목 배당표 잔류 0건
          const noUnassigned = (unassignedCount === 0);

          // 4. removeUnassignedClasses 함수 동작 검증
          // 의도적으로 미배정 셀 하나 주입 후 정리 실행
          tt['1-1'] = { subject: '테스트임시', pages: '1-2', lesson: '1', totalLesson: 10, teacher: '' };
          const cleaned = App.removeUnassignedClasses(false);
          const cleanPass = (cleaned >= 1 && !tt['1-1']);

          const pass = allWeeksBalanced && lastTwoDaysExcluded && noUnassigned && cleanPass;
          return {
            pass,
            message: pass
              ? `1~4주차 균등 배정 완벽 성공 [1주:${weekCounts[0]}h, 2주:${weekCounts[1]}h, 3주:${weekCounts[2]}h, 4주:${weekCounts[3]}h], 마지막 2일 수업 0건 배제 확인, 미배정 과목 자동 제거 무결성 100% 검증 완료`
              : `검증 실패 (balanced:${allWeeksBalanced} ${JSON.stringify(weekCounts)}, lastTwoDays:${lastTwoDaysExcluded} [d18:${day18Count}, d19:${day19Count}], noUnassigned:${noUnassigned}, clean:${cleanPass})`
          };
        }
      }
    ];

    function runAllTests() {
      const resultsContainer = document.getElementById('test-results');
      resultsContainer.innerHTML = '';
      let passed = 0;
      let failed = 0;

      testCases.forEach((tc, idx) => {
        let res;
        try {
          res = tc.run();
        } catch (e) {
          window.firstErr = window.firstErr || (tc.id + ': ' + e.message);
          res = { pass: false, message: '예외 발생: ' + e.message };
        }

        tc.lastPass = res.pass;
        tc.lastMsg = res.message;
        if (res.pass) passed++;
        else failed++;

        const item = document.createElement('div');
        item.className = `p-4 rounded-xl border ${res.pass ? 'bg-slate-800/90 border-emerald-500/40 text-slate-100' : 'bg-rose-950/40 border-rose-500/40 text-rose-100'} flex items-start gap-3 transition`;
        item.innerHTML = `
          <div class="p-1 rounded-lg ${res.pass ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">
            <i data-lucide="${res.pass ? 'check-circle-2' : 'x-circle'}" class="w-5 h-5"></i>
          </div>
          <div class="flex-1 space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sm text-white">${tc.title}</span>
              <span class="text-xs px-2 py-0.5 rounded font-mono font-bold ${res.pass ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">
                ${res.pass ? 'PASSED' : 'FAILED'}
              </span>
            </div>
            <p class="text-xs text-slate-400">${tc.desc}</p>
            <div class="text-xs font-mono pt-1 ${res.pass ? 'text-emerald-300' : 'text-rose-300'}">
              &rarr; ${res.message}
            </div>
          </div>
        `;
        resultsContainer.appendChild(item);
      });

      document.getElementById('total-tests').innerText = testCases.length;
      document.getElementById('passed-tests').innerText = passed;
      document.getElementById('failed-tests').innerText = failed;
      const summary = testCases.map(t => `${t.id}:${t.lastPass?'PASS':'FAIL[' + t.lastMsg + ']'}`).join(' | ');
      document.title = `[${passed}/${testCases.length}] ${summary}`;
      console.log(`[BENCHMARK FINISHED] ${passed} PASSED, ${failed} FAILED`);
      fetch('/report', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ passed, failed, total: testCases.length, details: testCases.map(t => ({id: t.id, pass: t.lastPass, msg: t.lastMsg})) })
      }).catch(() => {});
      lucide.createIcons();
    }

    let runnerStarted = false;
    function startRunner() {
      if (runnerStarted) return;
      const frame = document.getElementById('app-frame');
      try {
        if (frame && frame.contentWindow && frame.contentWindow.App) {
          App = frame.contentWindow.App;
          window.App = App;
          frame.contentWindow.alert = () => {};
          frame.contentWindow.confirm = () => true;
          window.alert = () => {};
          window.confirm = () => true;
          runnerStarted = true;
          runAllTests();
          return;
        }
      } catch (e) {
        console.warn('Waiting for iframe to load App:', e);
      }
      setTimeout(startRunner, 150);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const frame = document.getElementById('app-frame');
      if (frame) {
        frame.onload = () => setTimeout(startRunner, 200);
      }
      setTimeout(startRunner, 500);
    });
  </script>
</body>
